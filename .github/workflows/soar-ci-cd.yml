
name: SOAR CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "app/soar/**"
      - "tests/soar/**"
      - "deploy/soar/**"
      - ".github/workflows/soar-ci-cd.yml"

  pull_request:
    branches:
      - main
    paths:
      - "app/soar/**"
      - "tests/soar/**"
      - "deploy/soar/**"
      - ".github/workflows/soar-ci-cd.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  soar-tests:
    name: Test SOAR Application
    runs-on: [self-hosted, Windows]

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python version
        run: |
          py --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create isolated Python environment
        run: |
          py -3.11 -m venv .venv-ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install SOAR dependencies
        run: |
          & ".\.venv-ci\Scripts\python.exe" -m pip install -r app/soar/requirements.txt pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Python syntax
        run: |
          & ".\.venv-ci\Scripts\python.exe" -m compileall -q app/soar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run SOAR unit and integration tests
        run: |
          & ".\.venv-ci\Scripts\python.exe" -m pytest tests/soar -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify SOAR package contents
        run: |
          $required = @(
            "app/soar/main.py",
            "app/soar/rules.py",
            "app/soar/actions.py",
            "app/soar/dedup.py",
            "app/soar/metrics.py",
            "app/soar/requirements.txt"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Missing required file: $file"
            }
          }

          $playbooks = @(Get-ChildItem app/soar/playbooks -Filter "*.py" -File)

          if ($playbooks.Count -eq 0) {
            throw "No SOAR playbook modules found"
          }

          Write-Host "SOAR source validation passed"
          Write-Host "Playbook modules found: $($playbooks.Count)"
  

  deploy-soar:
    name: Deploy SOAR to AWS
    needs: soar-tests
    runs-on: [self-hosted, Windows]

    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    timeout-minutes: 20

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4

      - name: Verify AWS authentication
        run: |
          aws sts get-caller-identity --profile university
          if ($LASTEXITCODE -ne 0) {
            throw "AWS authentication failed on the runner"
          }

      - name: Package and deploy SOAR
        run: |
          $ErrorActionPreference = "Stop"

          $profile = "university"
          $region = "eu-central-1"
          $instanceId = "i-06706f222e5ff9178"
          $bucket = "innovatech-cs2-soar-artifacts-898534748807"

          $releaseId = "${{ github.sha }}"
          $prefix = "releases/$releaseId"

          $archive = Join-Path $env:RUNNER_TEMP "soar-release.zip"
          $script = "deploy/soar/deploy_release.sh"

          Write-Host "Packaging SOAR release $releaseId"

          # Package tracked application source and deployment script.
          # Git archive excludes untracked files and __pycache__.
          git archive --format=zip "--output=$archive" HEAD app/soar deploy/soar/deploy_release.sh

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create SOAR release package"
          }

          $archiveHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $scriptHash = (Get-FileHash $script -Algorithm SHA256).Hash.ToLowerInvariant()

          $artifactUri = "s3://$bucket/$prefix/soar-release.zip"
          $scriptUri = "s3://$bucket/$prefix/deploy_release.sh"

          Write-Host "Uploading application package"

          aws s3 cp $archive $artifactUri --profile $profile --region $region

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload application package"
          }

          Write-Host "Uploading deployment script"

          aws s3 cp $script $scriptUri --profile $profile --region $region

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload deployment script"
          }

          Write-Host "Sending deployment command through SSM"

          $commands = @(
            "set -e",
            "aws s3 cp '$scriptUri' /tmp/innovatech-soar-deploy.sh --region '$region'",
            "echo '$scriptHash  /tmp/innovatech-soar-deploy.sh' | sha256sum -c -",
            "bash /tmp/innovatech-soar-deploy.sh '$artifactUri' '$archiveHash'"
          )

          $parametersPath = Join-Path $env:RUNNER_TEMP "soar-deployment-ssm.json"

          @{
            commands = $commands
            executionTimeout = @("600")
          } |
            ConvertTo-Json -Depth 5 |
            Set-Content -Path $parametersPath -Encoding ASCII

          $commandId = aws ssm send-command `
            --instance-ids $instanceId `
            --document-name AWS-RunShellScript `
            --parameters "file://$($parametersPath.Replace('\','/'))" `
            --comment "Deploy Innovatech SOAR release $releaseId" `
            --profile $profile `
            --region $region `
            --query "Command.CommandId" `
            --output text

          if ($LASTEXITCODE -ne 0 -or -not $commandId -or $commandId -eq "None") {
            throw "Failed to submit SOAR deployment command"
          }

          Write-Host "SSM command ID: $commandId"

          Start-Sleep -Seconds 5

          $status = "Pending"

          for ($attempt = 0; $attempt -lt 90; $attempt++) {
            $status = aws ssm get-command-invocation `
              --command-id $commandId `
              --instance-id $instanceId `
              --profile $profile `
              --region $region `
              --query "Status" `
              --output text

            if ($LASTEXITCODE -ne 0) {
              throw "Unable to retrieve SSM command status"
            }

            Write-Host "Deployment status: $status"

            if ($status -notin @("Pending", "InProgress", "Delayed")) {
              break
            }

            Start-Sleep -Seconds 5
          }

          $result = aws ssm get-command-invocation `
            --command-id $commandId `
            --instance-id $instanceId `
            --profile $profile `
            --region $region `
            --output json | ConvertFrom-Json

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to retrieve deployment results"
          }

          Write-Host "`n=== Deployment output ==="
          Write-Host $result.StandardOutputContent

          if ($result.StandardErrorContent) {
            Write-Host "`n=== Deployment errors ==="
            Write-Host $result.StandardErrorContent
          }

          if ($result.Status -ne "Success") {
            throw "SOAR deployment failed with status: $($result.Status)"
          }

          Write-Host "`nSOAR deployment completed successfully!"
