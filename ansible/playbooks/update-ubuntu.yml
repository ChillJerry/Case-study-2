
---
- name: Centralized Ubuntu security and package updates
  hosts: onprem_servers
  become: true
  gather_facts: true
  serial: 1

  vars_files:
    - ../group_vars/all.yml

  tasks:
    - name: Verify target is Ubuntu
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == "Ubuntu"
        fail_msg: "This playbook supports Ubuntu only."

    - name: Refresh APT package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: "{{ update_cache_valid_time }}"

    - name: Install available package upgrades
      ansible.builtin.apt:
        upgrade: safe
      register: update_result

    - name: Check whether a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Display update summary
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Packages changed: {{ update_result.changed }}"
          - "Reboot required: {{ reboot_required.stat.exists }}"
          - "Automatic reboot allowed: {{ update_reboot_allowed }}"
