
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: "onprem-linux"
    static_configs:
      - targets:
          - "10.30.0.10:9100"
        labels:
          environment: "on-premises"
          host: "cs2-onprem-linux"

  - job_name: "onprem-security"
    static_configs:
      - targets: [ "10.30.0.20:9100" ]
        labels:
          environment: "on-premises"
          host: "cs2-onprem-security"

  - job_name: "onprem-gateway"
    static_configs:
      - targets: [ "10.30.0.1:9100" ]
        labels:
          environment: "on-premises"
          host: "cs2-onprem-gateway"

  - job_name: "soar"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "10.20.10.20:8080"
        labels:
          environment: "aws"
          service: "innovatech-soar"

  - job_name: alloy
    static_configs:
      - targets:
          - alloy:12345

