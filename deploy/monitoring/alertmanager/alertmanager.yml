
global:
  resolve_timeout: 5m

route:
  receiver: soar-webhook
  group_by:
    - alertname
    - instance
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: default-receiver

  - name: soar-webhook
    webhook_configs:
      - url: http://10.20.20.10:8000/alerts
        send_resolved: true
        http_config:
          http_headers:
            X-SOAR-Token:
              files:
                - /etc/alertmanager/secrets/soar-token

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname
      - instance
